Host github.com gist.github.com codeberg.org
	User git
	IdentityFile ~/.ssh/id_ed25519_git
	ControlMaster auto

Match user "codespace" originalhost "cs.*" final
	IdentityFile ~/.ssh/id_ed25519_git

Host gitlab.com
	User git
	ControlMaster auto

Host review.openstack.org
	ControlMaster auto

Host salsa.debian.org
	ControlMaster auto

